name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Mirrors compose.yaml: same image, same credentials as .env.example, and
    # the same published port, since `composer setup` copies .env.example to .env.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: workflowhub
          POSTGRES_USER: workflowhub
          POSTGRES_PASSWORD: change_me
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U workflowhub -d workflowhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Create test database
        env:
          PGPASSWORD: change_me
        run: |
          psql -h 127.0.0.1 -p 5433 -U workflowhub -d workflowhub \
            -c 'CREATE DATABASE workflowhub_testing OWNER workflowhub'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
