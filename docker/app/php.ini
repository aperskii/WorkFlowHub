; Production PHP settings for the WorkFlowHub image.
;
; Loaded from conf.d as zz-workflowhub.ini so it lands after the base image's
; own configuration and wins on any overlap.

expose_php = Off
memory_limit = 256M
max_execution_time = 60

post_max_size = 20M
upload_max_filesize = 20M

; Errors go to the container's stderr, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

date.timezone = UTC

; The image is immutable, so opcache never needs to stat files for changes.
; This is the single largest performance difference between this config and the
; development default, and it is only safe because code cannot change in place.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions are database-backed (SESSION_DRIVER=database), so PHP's own session
; handler is unused. Left at defaults deliberately rather than tuned.
