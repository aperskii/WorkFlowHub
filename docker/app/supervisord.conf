; Supervisor runs the two long-lived processes in this container and restarts
; either one if it dies.
;
; No `user` directive: the container has already dropped to www-data, and every
; path below is chosen so an unprivileged process can write to it.

[supervisord]
nodaemon = true
logfile = /dev/stdout
logfile_maxbytes = 0
loglevel = info
pidfile = /tmp/supervisord.pid

; Needed for `supervisorctl status` to reach the running instance.
[unix_http_server]
file = /tmp/supervisor.sock

[supervisorctl]
serverurl = unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Turns "supervisord gave up" into "the container exits", so a process that
; cannot be restarted is replaced by the orchestrator instead of leaving the
; container up and passing health checks with nothing supervising it.
;
; stdout is the event protocol channel, so it is left alone here; only stderr is
; redirected to the container log.
[eventlistener:exit-on-fatal]
command = /usr/local/bin/exit-on-fatal
events = PROCESS_STATE_FATAL
autostart = true
autorestart = true
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; FPM starts first so the socket is listening before nginx begins proxying.
;
; stop/killasgroup send signals to the whole process group: without them a stop
; or restart can leave workers behind, and an orphaned worker still holding
; 127.0.0.1:9000 makes every subsequent start fail with exit status 78.
[program:php-fpm]
command = php-fpm --nodaemonize
priority = 10
autostart = true
autorestart = true
startretries = 3
startsecs = 3
stopasgroup = true
killasgroup = true
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
startretries = 3
startsecs = 3
stopasgroup = true
killasgroup = true
stopsignal = QUIT
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
