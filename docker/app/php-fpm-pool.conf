; PHP-FPM pool for the WorkFlowHub image.
;
; Overrides the base image's www pool. No user/group directive: the master
; process already runs as www-data, and FPM ignores (and warns about) those
; directives when it is not started as root.

[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000

; Sized for a small container. pm.max_children is the ceiling on concurrent PHP
; requests; at 256M memory_limit this assumes roughly 2GB available to the task
; and should be revisited alongside the task definition.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Worker output is forwarded to the master's stderr so it reaches the container
; log instead of disappearing.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null

; Required. With clear_env on (the default) FPM workers start with an empty
; environment and every runtime variable the platform injects — APP_KEY, DB_*,
; and the rest — would be invisible to Laravel.
clear_env = no

; Surfaced by the health endpoint's request path only; no status page exposed.
ping.path = /fpm-ping
