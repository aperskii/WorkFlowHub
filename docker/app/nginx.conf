# Nginx configuration for the WorkFlowHub application container.
#
# Runs wholly as www-data, so every path nginx writes to is relocated out of the
# root-owned defaults and into space the runtime user owns.

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Container convention: logs are the process's stdout/stderr, so the
    # orchestrator collects them rather than a file nobody rotates.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;

    server {
        listen      8080 default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        # Every request that is not a real file becomes a front-controller call.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite fingerprints its output, so those files can be cached forever and
        # a miss should 404 rather than fall through to PHP.
        location /build/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            fastcgi_hide_header X-Powered-By;

            fastcgi_read_timeout 60s;
            fastcgi_buffers      16 16k;
            fastcgi_buffer_size  32k;
        }

        # Dotfiles stay unreachable, except the ACME challenge path.
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
